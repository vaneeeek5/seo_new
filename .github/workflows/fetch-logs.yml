name: Fetch Server Logs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  fetch-logs:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Logs via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '80.78.241.208'
          username: 'root'
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD || secrets.ROOT_PASSWORD || secrets.SERVER_PASSWORD || secrets.PASSWORD || secrets.VPS_PASSWORD }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 5m
          script: |
            echo "========== DOCKER PS =========="
            docker ps -a

            echo ""
            echo "========== API LOGS (last 150 lines) =========="
            docker logs seo_saas_api --tail 150 2>&1 || docker logs $(docker ps -aq -f name=api) --tail 150 2>&1 || echo "Cannot find API container"

            echo ""
            echo "========== API LOGS (all containers matching 'api') =========="
            for cid in $(docker ps -aq --filter "name=api"); do
              echo "--- Container: $cid ---"
              docker logs $cid --tail 50 2>&1
            done

            echo ""
            echo "========== DOCKER COMPOSE PS =========="
            cd /var/www/seo_saas && docker compose -f docker-compose.prod.yml ps 2>&1 || true

            echo ""
            echo "========== ENV CHECK =========="
            cd /var/www/seo_saas && cat .env 2>/dev/null | grep -v KEY | grep -v PASSWORD | grep -v SECRET || echo "No .env file"
