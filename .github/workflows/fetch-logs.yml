name: Fetch Server Logs to Issue

on:
  push:
    branches:
      - main

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
          
      - name: Fetch Logs via native SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan 80.78.241.208 >> ~/.ssh/known_hosts
          
          echo "--- DOCKER PS ---" > logs.txt
          ssh root@80.78.241.208 "docker ps -a" >> logs.txt 2>&1
          
          echo "--- API LOGS ---" >> logs.txt
          ssh root@80.78.241.208 "docker logs seo_saas_api --tail 100" >> logs.txt 2>&1
          
          echo "--- WEB LOGS ---" >> logs.txt
          ssh root@80.78.241.208 "docker logs seo_saas_web --tail 100" >> logs.txt 2>&1
          
      - name: Create Issue with logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Server Logs $(date)" --body-file logs.txt --repo vaneeeek5/seo_saas
