name: Auto Deploy to Server on Push

on:
  push:
    branches:
      - main
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Build Monorepo
        run: |
          npx prisma generate --schema=apps/api/prisma/schema.prisma
          npm run build

      - name: Deploy via SSH (Key / Password)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '80.78.241.208'
          username: 'root'
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD || secrets.ROOT_PASSWORD || secrets.SERVER_PASSWORD || secrets.PASSWORD || secrets.VPS_PASSWORD }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 30m
          script: |
            export DEBIAN_FRONTEND=noninteractive
            echo "🚀 [CI/CD] Connected to server 80.78.241.208 successfully!"
            
            TARGET_DIR="/var/www/seo_saas"
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            
            # Sync repository
            if [ -d ".git" ]; then
              echo "📥 Pulling latest commits from GitHub main..."
              git fetch --all
              git reset --hard origin/main
            else
              echo "📥 Cloning repository from GitHub..."
              git clone https://github.com/vaneeeek5/seo_saas.git .
            fi
            
            chmod +x scripts/setup-server.sh
            ./scripts/setup-server.sh
            
            echo "🐳 Launching Docker Compose stack..."
            docker compose down --remove-orphans || true
            docker compose up -d --build --force-recreate
            
            echo "📝 API immediate startup logs (first 5s):"
            sleep 5
            docker compose logs api --tail 60
            
            echo "⏳ Waiting for postgres to be healthy..."
            for i in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -U postgres -d seo_saas > /dev/null 2>&1; then
                echo "✅ Postgres is ready!"
                break
              fi
              echo "  Attempt $i/30 - postgres not ready yet..."
              sleep 2
            done
            
            echo "🔍 Running Prisma db push via separate node call (not exec into api)..."
            docker compose run --rm --no-deps \
              -e DATABASE_URL="postgresql://postgres:postgrespassword@postgres:5432/seo_saas?schema=public" \
              api node -e "
                const { execSync } = require('child_process');
                try {
                  execSync('npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss', {stdio:'inherit'});
                } catch(e) { console.warn('prisma db push warning:', e.message); }
              " || true
            
            echo "⏳ Waiting for API to respond on port 4000..."
            for i in $(seq 1 40); do
              if curl -s --max-time 3 http://localhost:4000/health > /dev/null 2>&1; then
                echo "✅ API is responding on port 4000!"
                break
              fi
              echo "  Attempt $i/40 - API not ready yet..."
              if [ $((i % 10)) -eq 0 ]; then
                echo "📝 API logs at attempt $i:"
                docker compose logs api --tail 30
              fi
              sleep 3
            done
            
            echo "📊 Docker Container Status:"
            docker compose ps
            
            echo "📝 Final API Container Logs (Last 60 lines):"
            docker compose logs api --tail 60
            
            echo "🧪 Verifying Server Response:"
            curl -i http://localhost/health-check
            curl -s http://localhost:4000/health || echo "❌ API port 4000 still not ready"
            curl -i http://localhost:3000/
            
            echo "🎉 [CI/CD] Automated Deployment Completed Successfully!"
