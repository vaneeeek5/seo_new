name: Auto Deploy to Server on Push

on:
  push:
    branches:
      - main
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '80.78.241.208'
          username: 'root'
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD || secrets.ROOT_PASSWORD || secrets.SERVER_PASSWORD || secrets.PASSWORD || secrets.VPS_PASSWORD }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 10m
          script: |
            export DEBIAN_FRONTEND=noninteractive
            echo "🚀 [CI/CD] Connected to server 80.78.241.208 successfully!"
            
            TARGET_DIR="/var/www/seo_saas"
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            
            # Sync repository
            if [ -d ".git" ]; then
              echo "📥 Pulling latest commits from GitHub main..."
              git remote set-url origin https://github.com/vaneeeek5/seo_new.git
              git fetch --all
              git reset --hard origin/main
            else
              echo "📥 Cloning repository from GitHub..."
              git clone https://github.com/vaneeeek5/seo_new.git .
            fi
            
            echo "🔧 Setting up Python environment..."
            cd auto-seo-main
            
            # Ensure uv is installed
            if ! command -v uv &> /dev/null; then
                curl -LsSf https://astral.sh/uv/install.sh | sh
                export PATH="$HOME/.cargo/bin:$PATH"
            fi
            
            echo "📦 Installing dependencies..."
            uv sync --extra dev --python 3.12
            
            echo "🐳 Ensuring Database and Redis are running..."
            docker-compose up -d || docker compose up -d
            
            echo "⚙️ Configuring systemd service..."
            cat << 'EOF' > /etc/systemd/system/autoseo.service
            [Unit]
            Description=AutoSEO FastAPI Backend
            After=network.target
            
            [Service]
            User=root
            WorkingDirectory=/var/www/seo_saas/auto-seo-main
            Environment="PATH=/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            ExecStart=/root/.cargo/bin/uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
            Restart=always
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            systemctl daemon-reload
            systemctl enable autoseo
            systemctl restart autoseo
            
            echo "✅ API server started on port 8000 via systemd!"
            echo "🎉 [CI/CD] Automated Deployment Completed Successfully!"
