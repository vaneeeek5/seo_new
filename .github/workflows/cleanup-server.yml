name: Cleanup Server

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: '80.78.241.208'
          username: 'root'
          port: 22
          key: ${{ secrets.SSH_PRIVATE_KEY || secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD || secrets.ROOT_PASSWORD || secrets.SERVER_PASSWORD || secrets.PASSWORD || secrets.VPS_PASSWORD }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 10m
          script: |
            echo "🛑 Stopping all project containers..."
            docker stop seo_saas_api seo_saas_web seo_saas_nginx seo_saas_postgres seo_saas_redis 2>/dev/null || true
            
            echo "🗑️ Removing all project containers..."
            docker rm seo_saas_api seo_saas_web seo_saas_nginx seo_saas_postgres seo_saas_redis 2>/dev/null || true
            
            echo "🗑️ Removing project Docker volumes..."
            docker volume rm seo_saas_postgres_data seo_saas_redis_data 2>/dev/null || true
            # Also try with underscored names (docker-compose naming variations)
            docker volume rm $(docker volume ls -q | grep seo_saas) 2>/dev/null || true
            
            echo "🗑️ Removing project Docker images..."
            docker rmi $(docker images | grep 'seo_saas\|ghcr.io/vaneeeek5' | awk '{print $3}') 2>/dev/null || true
            docker image prune -f 2>/dev/null || true
            
            echo "🗑️ Removing project source code directory..."
            rm -rf /var/www/seo_saas
            
            echo "🗑️ Removing any other project directories..."
            rm -rf /opt/seo_saas
            rm -rf /root/seo_saas
            
            echo ""
            echo "✅ Cleanup complete. What's left on server:"
            echo "--- Docker (kept, system tool) ---"
            docker --version
            echo "--- Python (kept) ---"
            python3 --version 2>/dev/null || echo "not installed"
            echo "--- Node.js (kept if installed) ---"
            node --version 2>/dev/null || echo "not installed"
            echo "--- Disk usage after cleanup ---"
            df -h /
            echo ""
            echo "🎉 Server cleaned successfully! All project data removed."
